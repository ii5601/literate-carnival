name: AI

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Install Programs
        run: |
          Write-Host "Installing Tailscale"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.3-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          
          Write-Host "Installing Ollama"
          irm https://ollama.com/install.ps1 | iex

      - name: Establish Tailscale Connection and Run Web UI
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ai-gh-ruunner
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          docker run -d -p 3000:8080 --add-host=host.docker.internal:host-gateway -v open-webui:/app/backend/data --name open-webui --restart always ghcr.io/open-webui/open-webui:main
      
      - name: Verify Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 8080
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 8080
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "Connection to port 8080 failed"
              exit 1
          }
          Write-Host "Connectivity successful!"

      - name: Maintain Connection
        run: |
          $publicIP = (Invoke-WebRequest -UseBasicParsing https://ipinfo.io/ip).Content
          Write-Host "`n===== ACCESS ====="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Public IP: $publicIP"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] AI Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
