name: AI

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Programs
        run: |
          echo "Installing Tailscale"
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y tailscale

          echo "Installing Ollama"
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Establish Tailscale Connection and Run Web UI
        run: |
          # Bring up Tailscale with the provided auth key
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ai-gh-runner

          # Wait for Tailscale to assign an IP
          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
              tsIP=$(tailscale ip -4)
              sleep 5
              retries=$((retries+1))
          done

          if [ -z "$tsIP" ]; then
              echo "Tailscale IP not assigned. Exiting."
              exit 1
          fi
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

          # Run Open WebUI on port 80 (standard HTTP port)
          docker run -d -p 80:8080 \
            --add-host=host.docker.internal:host-gateway \
            -v open-webui:/app/backend/data \
            --name open-webui \
            --restart unless-stopped \
            ghcr.io/open-webui/open-webui:main

          # Give container time to start
          sleep 10

      - name: Verify and Display Access
        run: |
          publicIP=$(curl -s https://ipinfo.io/ip)
          
          echo -e "\n=========================================="
          echo "✅ Open WebUI is running!"
          echo "=========================================="
          echo "📌 Access URLs:"
          echo ""
          echo "🔹 Via Tailscale (recommended):"
          echo "   http://$TAILSCALE_IP"
          echo ""
          echo "🔹 Via Public IP (might not work):"
          echo "   http://$publicIP"
          echo ""
          echo "⚠️  Note: GitHub Actions runners may not expose public ports"
          echo "🔒 Use Tailscale IP for reliable access"
          echo "=========================================="
          
          # Test local access
          echo "Testing local access..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:80

      - name: Maintain Connection
        run: |
          publicIP=$(curl -s https://ipinfo.io/ip)
          
          while true; do
              echo "[$(date)] ✅ Open WebUI is active"
              echo "   🌐 http://$TAILSCALE_IP"
              echo "   🌐 http://$publicIP (may not work)"
              echo ""
              sleep 300
          done
