name: AI

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Programs
        run: |
          echo "Installing Tailscale"
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y tailscale

          echo "Installing Ollama"
          curl -fsSL https://ollama.com/install.sh | sh

          echo "Installing Docker"
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo usermod -aG docker $USER

      - name: Establish Tailscale Connection and Run Web UI
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ai-gh-runner

          # Wait for Tailscale to assign an IP
          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
              tsIP=$(tailscale ip -4)
              sleep 5
              retries=$((retries+1))
          done

          if [ -z "$tsIP" ]; then
              echo "Tailscale IP not assigned. Exiting."
              exit 1
          fi
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

          # Run Open WebUI in Docker
          docker run -d -p 3000:8080 --add-host=host.docker.internal:host-gateway -v open-webui:/app/backend/data --name open-webui --restart unless-stopped ghcr.io/open-webui/open-webui:main

      - name: Verify Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          # Test connectivity using nc (netcat) against the Tailscale IP on port 8080
          timeout 5 nc -zv $TAILSCALE_IP 8080
          if [ $? -ne 0 ]; then
              echo "Connection to port 8080 failed"
              exit 1
          fi
          echo "Connectivity successful!"

      - name: Maintain Connection
        run: |
          publicIP=$(curl -s https://ipinfo.io/ip)
          echo -e "\n===== ACCESS ====="
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "Public IP: $publicIP"
          echo -e "==================\n"

          # Keep runner active indefinitely (or until manually cancelled)
          while true; do
              echo "[$(date)] AI Active - Use Ctrl+C in workflow to terminate"
              sleep 300
          done