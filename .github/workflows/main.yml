name: Ollama Remote Server

on:
  workflow_dispatch: # Запуск вручную из интерфейса GitHub

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and Pull Model
        run: |
          # Разрешаем внешние подключения к Ollama внутри контейнера
          export OLLAMA_HOST="0.0.0.0:11434"
          ollama serve &
          
          sleep 5
          ollama pull qwen2.5-coder:7b

      - name: Setup SSH Tunnel (Улучшенный)
        uses: mxschmitt/action-tmate@v3
        with:
          # Этот экшен сам установит tmate, выведет SSH-ссылку ярким цветом 
          # и остановит воркфлоу для ожидания вашего подключения
          limit-access-to-actor: false

          
          # Держим воркфлоу активным 2 часа (или пока вы его не отмените)
          sleep 7200
